<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Малыш</title>
  <meta name="description" content="Сон, кормление, подгузники, звуки, рост и прививки. Работает офлайн, данные остаются в браузере.">
  <meta name="theme-color" content="#F7F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11111B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Малыш">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F7F3EE; overscroll-behavior: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #11111B; } }
    #app { position: fixed; inset: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; font: 600 16px -apple-system, "Segoe UI", Roboto, sans-serif; color: #7D7888; z-index: 10;
      background: inherit;
    }
    #loading img { width: 88px; height: 88px; border-radius: 22px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/icon-192.png" alt="">Загружаем «Малыша»…</div>
  <div id="app"></div>
  <script src="malysh.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>

# Собирает веб-версию (Kotlin/Wasm, модуль webApp) и выкладывает на GitHub Pages.
# Один раз: Settings → Pages → Source: GitHub Actions.
# Если публикация «зависла» и новые отклоняются: переключить Source на «Deploy from a branch» и обратно.
name: Веб-версия

on:
  push:
    branches: [main]
    paths: ['shared/src/commonMain/**', 'webApp/**', 'shared/build.gradle.kts', 'gradle/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать веб-версию
        run: |
          chmod +x gradlew
          ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v4
        # если публикация зависнет на стороне GitHub — упасть через 5 минут, а не висеть
        with:
          timeout: 300000
